{% extends "base.html" %}
{% block title %}Вход — StreamKit{% endblock %}
{% block body %}
<h1>Вход</h1>
<section>
<form method="post" action="{{ url_for('login_post') }}" autocomplete="off">
  <input type="hidden" name="csrf" value="{{ csrf_token() }}">
  {% if error %}<p class="err">{{ error }}</p>{% endif %}
  <label for="username">Логин</label>
  <input type="text" id="username" name="username" required maxlength="24" autocapitalize="none" autocomplete="username">
  <label for="password">Пароль</label>
  <input type="password" id="password" name="password" required maxlength="200" autocomplete="current-password">
  <label for="code">Код из приложения (6 цифр)</label>
  <input type="text" id="code" name="code" required inputmode="numeric" maxlength="7" autocomplete="one-time-code">
  <button type="submit">Войти</button>
</form>
</section>
<p class="hint">Аккаунт создаётся по приглашению. Нет ссылки — попроси администратора.</p>
{% endblock %}
