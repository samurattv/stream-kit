<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>StreamKit — мультичат</title>
<style>
  /* настройки из адреса: ?size=22&max=14&fade=45&bg=transparent&badges=1 */
  :root { --size: 22px; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body { font: 600 var(--size)/1.3 "Segoe UI", system-ui, sans-serif; color: #fff;
         display: flex; flex-direction: column; justify-content: flex-end; }
  #list { padding: 8px 12px; }
  .msg { display: flex; align-items: baseline; gap: .45em; margin: .2em 0; padding: .2em .55em;
         border-radius: .5em; background: rgba(0, 0, 0, .45); width: fit-content; max-width: 100%;
         text-shadow: 0 1px 3px rgba(0, 0, 0, .9); animation: in .25s ease-out;
         transition: opacity .8s; }
  .msg.old { opacity: 0; }
  .badge { flex: none; font-size: .6em; font-weight: 800; padding: .1em .45em; border-radius: .4em;
           letter-spacing: .04em; color: #fff; align-self: center; }
  .twitch .badge { background: #9146ff; }
  .youtube .badge { background: #ff2d2d; }
  .vk .badge { background: #2787f5; }
  .nick { flex: none; font-weight: 800; }
  .twitch .nick { color: #c7a2ff; }
  .youtube .nick { color: #ff9a9a; }
  .vk .nick { color: #8dc2ff; }
  .text { overflow-wrap: anywhere; font-weight: 600; }
  .text img { height: 1.5em; vertical-align: middle; margin: 0 .05em; }
  @keyframes in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
<div id="list"></div>
<script>
const q = new URLSearchParams(location.search);
const num = (k, d) => { const v = parseFloat(q.get(k)); return isFinite(v) ? v : d; };
const MAX = Math.max(1, num("max", 14));
const FADE = Math.max(0, num("fade", 0));          // через сколько секунд сообщение гаснет, 0 — не гаснет
const BADGES = q.get("badges") !== "0";
document.documentElement.style.setProperty("--size", num("size", 22) + "px");
if (q.get("bg") && q.get("bg") !== "transparent") document.body.style.background = q.get("bg");
const LABEL = { twitch: "TW", youtube: "YT", vk: "VK" };
const IMG_OK = /^https:\/\/images\.live\.vkvideo\.ru\//;
const list = document.getElementById("list");

function add(m) {
  if (!m || typeof m !== "object") return;
  const platform = LABEL[m.platform] ? m.platform : "twitch";
  const row = document.createElement("div");
  row.className = "msg " + platform;
  if (BADGES) {
    const b = document.createElement("span");
    b.className = "badge"; b.textContent = LABEL[platform];
    row.appendChild(b);
  }
  const nick = document.createElement("span");
  nick.className = "nick"; nick.textContent = String(m.user || "") + ":";
  row.appendChild(nick);
  const text = document.createElement("span");
  text.className = "text";
  for (const p of Array.isArray(m.parts) ? m.parts : []) {
    if (p && typeof p.img === "string" && IMG_OK.test(p.img)) {
      const i = document.createElement("img");
      i.src = p.img; i.alt = String(p.name || "");
      text.appendChild(i);
    } else if (p && typeof p.text === "string") {
      text.appendChild(document.createTextNode(p.text));
    }
  }
  row.appendChild(text);
  list.appendChild(row);
  while (list.children.length > MAX) list.removeChild(list.firstChild);
  if (FADE) {
    setTimeout(() => row.classList.add("old"), FADE * 1000);
    setTimeout(() => row.remove(), FADE * 1000 + 900);
  }
}

function connect() {
  const ws = new WebSocket("ws://127.0.0.1:" + (q.get("ws") || (parseInt(location.port, 10) + 1)));
  ws.onmessage = (e) => {
    let d; try { d = JSON.parse(e.data); } catch { return; }
    if (Array.isArray(d.history)) { list.textContent = ""; d.history.slice(-MAX).forEach(add); }
    else add(d);
  };
  ws.onclose = () => setTimeout(connect, 2000);
}
connect();
</script>
</body>
</html>
