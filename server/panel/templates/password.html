{% extends "base.html" %}
{% block title %}Смена пароля — StreamKit{% endblock %}
{% block body %}
<h1>Смена пароля</h1>
<section>
<form method="post" action="{{ url_for('password_post') }}" autocomplete="off">
  <input type="hidden" name="csrf" value="{{ csrf_token() }}">
  {% if error %}<p class="err">{{ error }}</p>{% endif %}
  <label for="old">Текущий пароль</label>
  <input type="password" id="old" name="old" required maxlength="200" autocomplete="current-password">
  <label for="password">Новый пароль (от 12 символов)</label>
  <input type="password" id="password" name="password" required minlength="12" maxlength="200" autocomplete="new-password">
  <label for="password2">Повтори новый пароль</label>
  <input type="password" id="password2" name="password2" required minlength="12" maxlength="200" autocomplete="new-password">
  <label for="code">Код из приложения</label>
  <input type="text" id="code" name="code" required inputmode="numeric" maxlength="7" autocomplete="one-time-code">
  <button type="submit">Сменить</button>
</form>
<p class="hint">После смены все остальные устройства выйдут из аккаунта.</p>
</section>
<p><a href="{{ url_for('home') }}">Назад</a></p>
{% endblock %}
